trigger:
  branches:
    include: ['*']
  tags:
    include: ['*']

# NOTE: This pipeline no longer publishes GitHub releases. The GitHub Actions
# workflow (.github/workflows/complete-build.yml) is the single source of
# releases: on a tag it builds and publishes the full flat, standard-named
# asset set (Linux gnu/musl/aarch64/armv7, windows-gnu, macOS, .deb, .msi, docs
# and winget archives). A second publisher here only re-polluted the release
# with differently-named duplicates (tpnote-v<ver>-..., pc-windows-msvc, loose
# PDFs). This pipeline is kept purely for test coverage -- notably
# x86_64-pc-windows-msvc, which the GitHub native matrix (macOS-only) no longer
# runs.
stages:
  - stage: Tests
    jobs:
      - job:
        strategy:
          matrix:
            windows-stable:
              imageName: 'windows-latest'
              rustup_toolchain: stable
              target: 'x86_64-pc-windows-msvc'
            mac-stable:
              imageName: 'macOS-latest'
              rustup_toolchain: stable
              target: 'x86_64-apple-darwin'
            linux-stable:
              imageName: 'ubuntu-latest'
              rustup_toolchain: stable
              target: 'x86_64-unknown-linux-gnu'
        pool:
          vmImage: $(imageName)
        steps:
          - script: |
              curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain $RUSTUP_TOOLCHAIN
              echo "##vso[task.setvariable variable=PATH;]$PATH:$HOME/.cargo/bin"
            displayName: Install rust
            condition: ne( variables['Agent.OS'], 'Windows_NT' )
          - script: |
              sudo apt-get update
            condition: eq( variables['Agent.OS'], 'Linux' )
            displayName: Install build dependencies
          - script: |
                curl -sSf -o rustup-init.exe https://win.rustup.rs
                rustup-init.exe -y --default-toolchain %RUSTUP_TOOLCHAIN% --default-host x86_64-pc-windows-msvc
                echo "##vso[task.setvariable variable=PATH;]%PATH%;%USERPROFILE%\.cargo\bin"
            displayName: Windows install rust
            condition: eq( variables['Agent.OS'], 'Windows_NT' )
          - script: cargo build --all
            displayName: Cargo build
          - script: cargo test --all
            displayName: Cargo test
